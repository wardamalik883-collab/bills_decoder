[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bill_decoder"
version = "0.1.0"
description = "Pakistani utility bill decoder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv==1.2.4",
    "pydantic==2.14.0",
    "Pillow==12.3.0",
    "google-genai==2.29.0",
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["scripts", "data", "output", "cache", ".venv"]
